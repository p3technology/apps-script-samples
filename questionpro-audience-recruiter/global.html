<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuestionPro Audience Global Recruiter</title>
<style>
:root{--blue:#0b6fdd;--teal:#0f9d8a;--ink:#14233b;--muted:#667085;--line:#dfe5ec;--bg:#f4f7fb;--good:#067647;--warn:#9a5b00;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0d2745;color:#fff;padding:22px 15px}.brand{font-weight:800;font-size:17px}.brand small{display:block;color:#b9c9da;font-weight:500;margin-top:4px}.nav{margin-top:22px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#c8d5e4;padding:10px;border-radius:8px;margin:3px 0}.nav button.active{background:#173e68;color:white}.main{padding:24px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.grid{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.hero{background:linear-gradient(135deg,#0b6fdd,#0f9d8a);color:#fff;border-radius:17px;padding:22px;margin-bottom:15px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:#eaf7ff}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:700;color:#344054}.field input,.field select,.field textarea{border:1px solid #ccd5df;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:100px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer;color:var(--ink)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.good{background:var(--teal);border-color:var(--teal);color:#fff}.btn.warn{background:#fff7e8;border-color:#f0d29a;color:#7d5200}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf3ff;color:#0b5fad;font-size:11px;font-weight:800}.pill.good{background:#e9f8f1;color:var(--good)}.pill.warn{background:#fff4e5;color:var(--warn)}.small{font-size:12px}.muted{color:var(--muted)}.msg{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:9px;font-size:12px}.url{word-break:break-all;background:#f8fafc;border:1px solid var(--line);padding:9px;border-radius:9px;font-size:11px}.source{border-left:4px solid var(--blue)}.creative{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}.creative img{width:280px;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#eef2f6}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #edf0f4}.status{padding:12px;border-radius:10px;background:#fff7e8;border:1px solid #f1d38d;color:#795200}.spinner{width:18px;height:18px;border:2px solid #ccd5df;border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.shell{display:block}.side{padding:14px}.nav{display:flex;overflow:auto;margin-top:10px}.nav button{width:auto;white-space:nowrap}.main{padding:14px}.two,.three,.formgrid,.creative{grid-template-columns:1fr}.creative img{width:100%;max-width:350px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand">Global Audience Recruiter<small>QuestionPro Audience</small></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="top"><div><h2 id="title" style="margin:0">Geo Planner</h2><div class="small muted">Build localized source and creative packs for any market.</div></div><div class="actions"><a class="btn" href="admin.html">Campaign Builder</a><a class="btn" href="source-launch-kit.html">SA Launch Kit</a></div></div><div id="app"></div></main>
</div>
<script>
const API='https://questionpro-audience-recruiter-api.onrender.com';
const PUBLIC='https://questionpro-audience-recruiter.onrender.com/';
const DEST='https://researchpanel.questionpro.com';
const KEY='qp-global-recruiter-v1';
const groups={
 general_population:'General population',rural:'Rural residents',lower_income_mobile_first:'Lower-income / mobile-first adults',youth:'Youth / young adults',seniors:'Seniors',caregivers:'Caregivers',disability:'People with disabilities',healthcare_professionals:'Healthcare professionals',trades:'Trades / skilled labor',small_business:'Small business owners',multicultural_language:'Language / cultural communities',lgbtq:'LGBTQ+ communities',parents:'Parents',tech_professionals:'Technology professionals'};
const channels=['social','newsletter','community','partner','association','referral','sms','publisher','mobile'];
const quickGeos=[['United States','en-US'],['Canada','en-CA'],['Mexico','es-MX'],['Brazil','pt-BR'],['United Kingdom','en-GB'],['Germany','de-DE'],['France','fr-FR'],['Spain','es-ES'],['Italy','it-IT'],['Poland','pl-PL'],['South Africa','en-ZA'],['Nigeria','en-NG'],['Kenya','en-KE'],['Egypt','ar-EG'],['Saudi Arabia','ar-SA'],['United Arab Emirates','ar-AE'],['India','en-IN'],['Pakistan','ur-PK'],['Bangladesh','bn-BD'],['Indonesia','id-ID'],['Philippines','en-PH'],['Vietnam','vi-VN'],['Thailand','th-TH'],['Japan','ja-JP'],['South Korea','ko-KR'],['Australia','en-AU'],['New Zealand','en-NZ']];
let state=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{tab:'planner',token:'',country:'South Africa',region:'',city:'',language:'en-ZA',group:'general_population',audience:'Adults 18+',channel:'social',message:'Share your experience. Join a voluntary research community and receive invitations matched to your profile.',sources:[],prompt:'',image:null}}catch{return {tab:'planner',token:''}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['planner','Geo Planner'],['sources','Source Scout'],['creative','Creative Studio'],['launch','Launch Pack'],['settings','Settings']];
function renderNav(){document.getElementById('nav').innerHTML=tabs.map(([id,n])=>`<button class="${state.tab===id?'active':''}" onclick="state.tab='${id}';save()">${n}</button>`).join('')}
function render(){renderNav();document.getElementById('title').textContent=Object.fromEntries(tabs)[state.tab];document.getElementById('app').innerHTML=({planner,sources,creative,launch,settings})[state.tab]();}
function commonFields(){return `<div class="formgrid"><div class="field"><label>Country</label><input id="country" value="${esc(state.country||'')}"></div><div class="field"><label>Region/state/province</label><input id="region" value="${esc(state.region||'')}"></div><div class="field"><label>City/locality (optional)</label><input id="city" value="${esc(state.city||'')}"></div><div class="field"><label>Language/locale</label><input id="language" value="${esc(state.language||'auto')}"></div><div class="field"><label>Special group</label><select id="group">${Object.entries(groups).map(([k,v])=>`<option value="${k}" ${state.group===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Audience detail</label><input id="audience" value="${esc(state.audience||'Adults 18+')}"></div></div>`}
function sync(){['country','region','city','language','group','audience','channel','message'].forEach(id=>{const el=document.getElementById(id);if(el)state[id]=el.value});localStorage.setItem(KEY,JSON.stringify(state));}
function planner(){return `<section class="hero"><h1>One recruiting engine for every geography</h1><p>Pick a geography and a special population. The system creates the source strategy, local campaign IDs, localized messaging, and creative direction.</p></section><div class="grid two"><div class="card"><h3>Audience definition</h3>${commonFields()}<div class="actions"><button class="btn primary" onclick="sync();state.tab='sources';save()">Find sources</button><button class="btn" onclick="sync();state.tab='creative';save()">Build creative</button></div></div><div class="card"><h3>Quick geographies</h3><div class="actions">${quickGeos.map(([c,l])=>`<button class="btn" onclick="state.country='${c.replace(/'/g,"\\'")}';state.language='${l}';save()">${c}</button>`).join('')}</div><p class="small muted" style="margin-top:14px">Any country, region, state, province, city, or language can also be entered manually. The quick list is only a shortcut.</p><h3>Special-group rule</h3><p class="small muted">For disability, health, LGBTQ+, caregiving and other sensitive populations, the engine favors trusted organizations, publishers and opt-in communities. It does not rely on sensitive-trait ad targeting.</p></div></div>`}
async function api(path,body){if(!state.token)throw new Error('Set the admin token in Settings first.');const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':state.token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||'Request failed');return j}
function sources(){const s=state.sources||[];return `<div class="grid two"><div class="card"><h3>Source scout</h3>${commonFields()}<div class="actions"><button class="btn primary" onclick="runScout()">Scout ${esc(state.country||'market')}</button><button class="btn" onclick="state.tab='planner';save()">Change geo</button></div><div id="scoutStatus" class="small muted" style="margin-top:10px"></div></div><div class="card"><h3>What it searches</h3><p class="small muted">Local publishers and newsletters, professional associations, nonprofits and advocacy organizations, permission-based communities, mobile channels, referral networks, trade media and partner organizations.</p><div class="status small">The live web scout requires an OpenAI API key on the Render backend. Without it, the engine still produces market-specific search queries and source archetypes.</div></div></div><div class="grid two" style="margin-top:14px">${s.map(x=>`<article class="card source"><span class="pill">${esc(x.type||'source')}</span><h3>${esc(x.name||x)}</h3><div class="small muted">${esc(x.geography||state.country)} ${x.special_group?'· '+esc(x.special_group):''}</div><p class="small">${esc(x.why_fit||x.quality_rationale||'')}</p>${x.public_url?`<div class="url">${esc(x.public_url)}</div>`:''}<div class="small muted" style="margin-top:8px">${esc(x.pilot_channel||'')} ${x.pilot_size?'· '+esc(x.pilot_size):''}</div>${x.localization_notes?`<p class="small muted">${esc(x.localization_notes)}</p>`:''}</article>`).join('')}</div>`}
async function runScout(){sync();const st=document.getElementById('scoutStatus');st.innerHTML='<span class="spinner"></span> Scouting current sources…';try{const d=await api('/api/scout',{country:state.country,region:state.region,language:state.language,group:state.group,audience:state.audience,count:10});if(d.sources)state.sources=d.sources;else if(d.archetypes)state.sources=d.archetypes.map((name,i)=>({name,type:'archetype',geography:state.country,why_fit:d.guidance,source_id:`${slug(state.country)}_${state.group}_${i+1}`}));state.scoutQueries=d.searchQueries||[];localStorage.setItem(KEY,JSON.stringify(state));render()}catch(e){st.textContent=e.message}}
function creative(){return `<div class="grid two"><div class="card"><h3>Geo-specific creative</h3>${commonFields()}<div class="field"><label>Channel</label><select id="channel">${channels.map(c=>`<option ${state.channel===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Core recruitment message</label><textarea id="message">${esc(state.message||'')}</textarea></div><div class="actions"><button class="btn primary" onclick="buildPrompt()">Create image brief</button><button class="btn good" onclick="generateImage()">Generate image</button></div><div id="creativeStatus" class="small muted" style="margin-top:10px"></div></div><div class="card"><h3>Creative rules</h3><ul class="small muted"><li>Use locally recognizable settings without reducing a market to flags or stereotypes.</li><li>Use authentic people and environments appropriate to the audience.</li><li>Leave safe space for localized headline/CTA text.</li><li>Accessible contrast and mobile-first composition.</li><li>No guaranteed earnings, cash-pile imagery, stigmatizing imagery or implied diagnosis.</li></ul></div></div><div class="card creative" style="margin-top:14px"><div>${state.image?`<img src="${esc(state.image)}" alt="Generated recruitment creative">`:`<div style="width:280px;aspect-ratio:1/1;border:1px dashed #b8c4d1;border-radius:12px;display:grid;place-items:center;color:#667085">Generated image</div>`}</div><div><h3>Image brief</h3><div class="msg">${esc(state.prompt||'Create a brief to see the geo-specific image direction.')}</div><div class="actions" style="margin-top:10px">${state.prompt?`<button class="btn" onclick="copy(state.prompt)">Copy prompt</button>`:''}${state.image?`<a class="btn" href="${esc(state.image)}" download="audience-${slug(state.country)}-${state.group}.png">Save image</a>`:''}</div></div></div>`}
async function buildPrompt(){sync();const st=document.getElementById('creativeStatus');st.innerHTML='<span class="spinner"></span> Building local creative brief…';try{const d=await api('/api/creative/prompt',{country:state.country,region:state.region,city:state.city,language:state.language,group:state.group,audience:state.audience,channel:state.channel,message:state.message});state.prompt=d.prompt;state.image=null;localStorage.setItem(KEY,JSON.stringify(state));render()}catch(e){st.textContent=e.message}}
async function generateImage(){sync();const st=document.getElementById('creativeStatus');if(!state.prompt){await buildPrompt();return}st.innerHTML='<span class="spinner"></span> Generating image…';try{const d=await api('/api/creative/generate',{prompt:state.prompt,size:'1024x1024',quality:'low'});if(d.b64_json)state.image='data:image/png;base64,'+d.b64_json;else if(d.url)state.image=d.url;localStorage.setItem(KEY,JSON.stringify(state));render()}catch(e){st.textContent=e.message}}
function slug(s){return String(s||'geo').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function trackingLink(sourceId,channel){const u=new URL(PUBLIC);u.searchParams.set('audience',`${state.country} ${groups[state.group]} research community`);u.searchParams.set('market',state.country);u.searchParams.set('reward','Paid opportunities may be available');u.searchParams.set('source',sourceId);u.searchParams.set('campaign',`${slug(state.country)}_${state.group}_${slug(channel)}_pilot`);u.searchParams.set('audience_id',`${slug(state.country)}_${state.group}`);u.searchParams.set('dest',DEST);u.searchParams.set('contact','research-panel@questionpro.com');return u.toString()}
function localizedCopy(channel){const name=groups[state.group]||'research participants';const market=state.country||'your country';const link=trackingLink(`${slug(market)}_${state.group}_${slug(channel)}_1`,channel);const base=`People in ${market}: share your experience and help improve the products and services people use. Join a voluntary QuestionPro research community for invitations matched to your profile. Paid opportunities may be available: ${link}`;const t={sms:`Share your views in research. Paid opportunities may be available. Join: ${link}. Reply STOP to opt out.`,newsletter:`Subject: Research opportunities for people in ${market}\n\nWe are inviting ${name.toLowerCase()} in ${market} to join a voluntary QuestionPro research community. Members may receive survey and interview invitations matched to their profile. Compensation and time requirements are disclosed for each opportunity.\n\nJoin: ${link}`,partner:`QuestionPro Audience is seeking a permission-based recruitment partnership in ${market} for ${name.toLowerCase()}. We provide transparent participant language, a dedicated tracking link and downstream quality reporting. Participant link: ${link}`,community:`Admin permission requested: We would like to share a voluntary QuestionPro research-community invitation with eligible ${name.toLowerCase()} in ${market}. Details: ${link}`};return t[channel]||base}
function launch(){const pack=channels.map(c=>({channel:c,source:`${slug(state.country)}_${state.group}_${slug(c)}_1`,link:trackingLink(`${slug(state.country)}_${state.group}_${slug(c)}_1`,c),copy:localizedCopy(c)}));return `<section class="hero"><h1>${esc(state.country)} · ${esc(groups[state.group])}</h1><p>A complete attributable recruitment pack across channels.</p></section><div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="downloadPack()">Download launch CSV</button><button class="btn" onclick="state.tab='creative';save()">Generate creative</button><button class="btn" onclick="state.tab='sources';save()">Scout sources</button></div><div class="grid two">${pack.map(p=>`<div class="card"><span class="pill">${p.channel}</span><h3>${esc(p.source)}</h3><div class="msg">${esc(p.copy)}</div><div class="url" style="margin-top:8px">${esc(p.link)}</div><div class="actions" style="margin-top:9px"><button class="btn" onclick='copy(${JSON.stringify(p.copy)})'>Copy message</button><button class="btn" onclick='copy(${JSON.stringify(p.link)})'>Copy link</button></div></div>`).join('')}</div>`}
function downloadPack(){const rows=[['country','group','channel','source_id','campaign_id','link','message']];channels.forEach(c=>{const source=`${slug(state.country)}_${state.group}_${slug(c)}_1`;const link=trackingLink(source,c);rows.push([state.country,state.group,c,source,`${slug(state.country)}_${state.group}_${slug(c)}_pilot`,link,localizedCopy(c)])});const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`audience-${slug(state.country)}-${state.group}-launch.csv`;a.click();URL.revokeObjectURL(a.href)}
function settings(){return `<div class="grid two"><div class="card"><h3>Backend access</h3><div class="field"><label>Recruiter API</label><input readonly value="${API}"></div><div class="field"><label>Admin token</label><input id="token" type="password" value="${esc(state.token||'')}" placeholder="Paste pilot admin token"></div><button class="btn primary" onclick="state.token=document.getElementById('token').value.trim();save()">Save token locally</button><p class="small muted">The token is stored only in this browser. It protects source scouting and image generation endpoints from public use.</p><button class="btn" onclick="checkHealth()">Check API</button><div id="health" class="small muted" style="margin-top:8px"></div></div><div class="card"><h3>Current backend state</h3><p class="small muted">Source scouting and image generation are wired to the server. Live web scouting and automatic image generation turn on when an OpenAI API key is added to the Render service environment.</p><div class="status small">The participant-facing landing page and tracking links remain independent of the AI backend, so recruitment links still work if the AI service is sleeping or unavailable.</div></div></div>`}
async function checkHealth(){const el=document.getElementById('health');el.innerHTML='<span class="spinner"></span> Checking…';try{const r=await fetch(API+'/health');const d=await r.json();el.textContent=`API ${d.ok?'online':'offline'} · web scout ${d.webScout?'ready':'needs API key'} · images ${d.imageGeneration?'ready':'needs API key'}`;}catch(e){el.textContent=e.message}}
function copy(t){navigator.clipboard.writeText(t).then(()=>alert('Copied'))}
render();
</script>
</body></html>
