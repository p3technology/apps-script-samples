<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuestionPro Audience Campaign Builder</title><style>
:root{--blue:#0b6fdd;--teal:#0f9d8a;--ink:#14233b;--muted:#667085;--line:#dfe5ec;--bg:#f5f7fa;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0d2745;color:white;padding:22px 16px}.brand{font-weight:800;line-height:1.3;margin-bottom:24px}.brand small{display:block;color:#b9c9da;font-weight:500;margin-top:3px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#c8d5e4;padding:10px;border-radius:8px;margin:3px 0}.side button.active{background:#173e68;color:white}.main{padding:24px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:15px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.kpi b{font-size:25px;display:block;margin-top:5px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.good{background:var(--teal);border-color:var(--teal);color:white}.actions{display:flex;gap:7px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #cfd7e2;border-radius:8px;padding:9px}.field textarea{min-height:110px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf3ff;color:#0b5fad;font-size:11px;font-weight:700}.pill.live{background:#e9f8f1;color:var(--good)}.msg{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);padding:11px;border-radius:9px;font-size:12px;max-height:160px;overflow:auto}.url{word-break:break-all;background:#f7f9fc;border:1px solid var(--line);padding:9px;border-radius:9px;font-size:11px}.row{display:flex;justify-content:space-between;gap:15px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #edf0f4}.empty{text-align:center;color:var(--muted);padding:30px}.modal{position:fixed;inset:0;background:rgba(12,28,48,.5);display:grid;place-items:center;padding:20px}.modalbox{background:white;border-radius:14px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;background:transparent;font-size:23px}.warn{background:#fff7e8;border:1px solid #f7d79c;color:#8a5200;padding:10px;border-radius:8px;font-size:12px}
@media(max-width:850px){.shell{display:block}.side{padding:14px}.side nav{display:flex;overflow:auto}.side button{width:auto;white-space:nowrap}.main{padding:15px}.kpis,.two,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">Audience Campaign Builder<small>QuestionPro Audience pilot</small></div><nav id="nav"></nav></aside><main class="main"><div class="top"><div><h2 id="title" style="margin:0">Overview</h2><div class="small muted">Data is stored only in this browser.</div></div><div class="actions"><button class="btn" onclick="exportData()">Export backup</button><button class="btn primary" onclick="openCampaign()">New campaign</button></div></div><div id="app"></div></main></div><div id="modal"></div><script>
const KEY='qp-audience-launch-admin-v2';
const PUBLIC_BASE='https://questionpro-audience-recruiter.onrender.com/';
const tabs=[['overview','Overview'],['campaigns','Campaigns'],['outcomes','Outcomes'],['settings','Settings']];
const defaultState={tab:'overview',settings:{publicBase:PUBLIC_BASE,destination:'https://researchpanel.questionpro.com',contact:'research-panel@questionpro.com'},campaigns:[{id:'sa-general-social-1',name:'South Africa General Population / Social Pilot',audience:'South Africa research community',market:'South Africa',reward:'Paid opportunities may be available',sourceType:'social',sourceName:'Social pilot source',sourceId:'sa_social_1',audienceId:'sa_general',destination:'https://researchpanel.questionpro.com',status:'draft',created:new Date().toISOString().slice(0,10)}],outcomes:[]};
let state=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function link(c){const base=(state.settings.publicBase||PUBLIC_BASE).replace(/\/?$/,'/');const u=new URL(base);u.searchParams.set('audience',c.audience);u.searchParams.set('market',c.market);u.searchParams.set('reward',c.reward);u.searchParams.set('source',c.sourceId);u.searchParams.set('campaign',c.id);u.searchParams.set('audience_id',c.audienceId);u.searchParams.set('dest',c.destination||state.settings.destination);u.searchParams.set('contact',state.settings.contact);return u.toString()}
function template(c){const l=link(c);const t={social:`South Africans: share your experience and help shape better products and services. Join the QuestionPro research community: ${l}`,newsletter:`Subject: Research opportunity for your audience\n\nWe are inviting South African adults to join a QuestionPro research community. Members may receive invitations to surveys and interviews matched to their profile. Participation is voluntary and compensation varies by opportunity.\n\nJoin here: ${l}`,sms:`Share your views in research. Paid opportunities may be available. Join: ${l}`,community:`Admin permission requested: We would like to share a voluntary QuestionPro research-community invitation with eligible South African adults. Details: ${l}`,partner:`Subject: Community recruitment partnership\n\nQuestionPro Audience is seeking permission-based partners to invite South African adults into a research community. We provide a dedicated tracking link and transparent participant language. Participant information: ${l}`,association:`Subject: Member research opportunities\n\nWe would like to offer eligible members access to voluntary research invitations. Compensation and time requirements are disclosed for each opportunity. Dedicated member link: ${l}`,referral:`Know someone whose experience should be represented in research? Share this invitation: ${l}`};return t[c.sourceType]||t.social}
function renderNav(){document.getElementById('nav').innerHTML=tabs.map(([id,n])=>`<button class="${state.tab===id?'active':''}" onclick="state.tab='${id}';save()">${n}</button>`).join('')}
function render(){renderNav();document.getElementById('title').textContent=Object.fromEntries(tabs)[state.tab];document.getElementById('app').innerHTML=({overview,campaigns,outcomes,settings})[state.tab]()}
function overview(){const live=state.campaigns.filter(c=>c.status==='live').length,total=state.outcomes.length,quality=state.outcomes.filter(o=>o.completed&&o.quality>=70&&!o.fraud).length;return `<div class="warn">Pilot boundary: sending/posting remains manual. The hosted recruitment page is live on Render. Confirm the QuestionPro destination before buying traffic.</div><div class="grid kpis" style="margin-top:15px"><div class="card kpi"><span class="muted small">Campaigns</span><b>${state.campaigns.length}</b></div><div class="card kpi"><span class="muted small">Marked live</span><b>${live}</b></div><div class="card kpi"><span class="muted small">Imported outcomes</span><b>${total}</b></div><div class="card kpi"><span class="muted small">Quality recruits</span><b>${quality}</b></div></div><div class="card"><h3>Launch sequence</h3><ol><li>Open the seeded South Africa campaign and confirm the destination URL.</li><li>Open the landing page and complete a test registration.</li><li>Confirm <code>qp_source</code>, <code>qp_campaign</code>, and <code>qp_audience</code> are retained in the QuestionPro export.</li><li>Copy approved channel messages into social, newsletter, community, referral, SMS, partner, or association sources.</li><li>Import outcomes and compare quality by source.</li></ol></div>`}
function campaigns(){return `<div class="grid two">${state.campaigns.map(c=>`<div class="card"><div class="row"><div><span class="pill ${c.status==='live'?'live':''}">${esc(c.status)}</span><h3>${esc(c.name)}</h3></div><button class="btn" onclick="openCampaign('${c.id}')">Edit</button></div><div class="small muted">${esc(c.market)} · ${esc(c.sourceType)} · ${esc(c.sourceName)}</div><div class="msg" style="margin-top:10px">${esc(template(c))}</div><div class="url" style="margin-top:8px">${esc(link(c))}</div><div class="actions" style="margin-top:9px"><button class="btn" onclick='copy(${JSON.stringify(template(c))})'>Copy message</button><button class="btn" onclick='copy(${JSON.stringify(link(c))})'>Copy link</button><button class="btn" onclick="window.open('${esc(link(c))}','_blank')">Test landing</button><button class="btn good" onclick="cstatus('${c.id}')">${c.status==='live'?'Pause':'Mark live'}</button></div></div>`).join('')||'<div class="empty">No campaigns.</div>'}</div>`}
function outcomes(){return `<div class="card"><div class="row"><div><h3>Import respondent outcomes</h3><p class="small muted">CSV columns: campaign_id, source_id, respondent_id, verified, completed, quality_score, fraud_flag, incentive_paid</p></div><label class="btn primary">Choose CSV<input type="file" accept=".csv" hidden onchange="importCSV(this.files[0])"></label></div></div><div class="card"><table class="table"><thead><tr><th>Campaign</th><th>Source</th><th>Respondent</th><th>Completed</th><th>Quality</th><th>Fraud</th></tr></thead><tbody>${state.outcomes.slice().reverse().map(o=>`<tr><td>${esc(o.campaignId)}</td><td>${esc(o.sourceId)}</td><td>${esc(o.respondentId)}</td><td>${o.completed?'Yes':'No'}</td><td>${o.quality}</td><td>${o.fraud?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div>`}
function settings(){const s=state.settings;return `<div class="card"><form onsubmit="saveSettings(event)"><div class="formgrid"><div class="field full"><label>Public recruitment landing base URL</label><input name="publicBase" value="${esc(s.publicBase)}"></div><div class="field full"><label>Default QuestionPro destination</label><input name="destination" value="${esc(s.destination)}"></div><div class="field"><label>Contact email</label><input name="contact" value="${esc(s.contact)}"></div></div><button class="btn primary">Save</button></form></div><div class="card"><h3>Data controls</h3><div class="actions"><button class="btn" onclick="exportData()">Export JSON</button><label class="btn">Import JSON<input type="file" accept=".json" hidden onchange="importData(this.files[0])"></label><button class="btn" onclick="reset()">Reset pilot</button></div></div>`}
function openCampaign(id=''){const c=state.campaigns.find(x=>x.id===id)||{id:'camp_'+uid(),name:'',audience:'South Africa research community',market:'South Africa',reward:'Paid opportunities may be available',sourceType:'social',sourceName:'',sourceId:'src_'+uid(),audienceId:'sa_general',destination:state.settings.destination,status:'draft'};document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h3>${id?'Edit':'New'} campaign</h3><form onsubmit="saveCampaign(event,'${id}')"><div class="formgrid"><div class="field full"><label>Campaign name</label><input required name="name" value="${esc(c.name)}"></div><div class="field"><label>Audience display name</label><input required name="audience" value="${esc(c.audience)}"></div><div class="field"><label>Market</label><input required name="market" value="${esc(c.market)}"></div><div class="field"><label>Reward language</label><input name="reward" value="${esc(c.reward)}"></div><div class="field"><label>Source type</label><select name="sourceType">${['social','newsletter','sms','community','partner','association','referral'].map(x=>`<option ${x===c.sourceType?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Source name</label><input required name="sourceName" value="${esc(c.sourceName)}"></div><div class="field"><label>Source ID</label><input required name="sourceId" value="${esc(c.sourceId)}"></div><div class="field"><label>Audience ID</label><input required name="audienceId" value="${esc(c.audienceId)}"></div><div class="field full"><label>QuestionPro destination</label><input required name="destination" value="${esc(c.destination)}"></div></div><button class="btn primary">Save campaign</button></form></div></div>`}
function saveCampaign(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const old=state.campaigns.find(x=>x.id===id);const obj={...d,id:old?.id||('camp_'+uid()),status:old?.status||'draft',created:old?.created||new Date().toISOString().slice(0,10)};if(old)Object.assign(old,obj);else state.campaigns.push(obj);closeModal();save()}
function cstatus(id){const c=state.campaigns.find(x=>x.id===id);c.status=c.status==='live'?'paused':'live';save()}
function saveSettings(e){e.preventDefault();state.settings=Object.fromEntries(new FormData(e.target));save()}
function closeModal(){document.getElementById('modal').innerHTML=''}
function copy(t){navigator.clipboard.writeText(t).then(()=>alert('Copied'))}
function parseCSV(t){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){const ch=t[i],next=t[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;}else if(ch==='"'){quoted=!quoted;}else if(ch===','&&!quoted){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell='';}else{cell+=ch;}}row.push(cell);if(row.some(v=>v!==''))rows.push(row);if(!rows.length)return[];const h=rows.shift().map(x=>x.trim());return rows.map(cols=>Object.fromEntries(h.map((key,i)=>[key,(cols[i]??'').trim()]))) }
function truth(v){return ['1','true','yes','y'].includes(String(v).toLowerCase())}
function importCSV(f){if(!f)return;const r=new FileReader();r.onload=()=>{parseCSV(r.result).forEach(d=>state.outcomes.push({campaignId:d.campaign_id,sourceId:d.source_id,respondentId:d.respondent_id,verified:truth(d.verified),completed:truth(d.completed),quality:+d.quality_score||0,fraud:truth(d.fraud_flag),incentive:+d.incentive_paid||0}));save()};r.readAsText(f)}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='qp-audience-recruiter-backup.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{state=JSON.parse(r.result);save()};r.readAsText(f)}
function reset(){if(confirm('Reset pilot data?')){state=structuredClone(defaultState);save()}}
render();
</script></body></html>
