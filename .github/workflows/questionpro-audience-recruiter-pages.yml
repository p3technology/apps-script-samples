name: Deploy QuestionPro Audience Recruiter

on:
  push:
    branches: ["main"]
    paths:
      - "questionpro-audience-recruiter/**"
      - ".github/workflows/questionpro-audience-recruiter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "questionpro-audience-recruiter-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./questionpro-audience-recruiter"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
